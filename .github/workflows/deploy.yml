name: Deploy

# Builds master and publishes it to Firebase Hosting. Needs these repository
# secrets (Settings > Secrets and variables > Actions):
#   FIREBASE_SERVICE_ACCOUNT  a key from Firebase console > Project settings > Service accounts
#   VITE_FIREBASE_*           the six web app values, as in .env.example
# Until FIREBASE_SERVICE_ACCOUNT is set, the job builds and stops short of deploying.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      HAS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Skip the deploy until Firebase is connected
        if: env.HAS_SERVICE_ACCOUNT != 'true'
        run: echo "::notice::FIREBASE_SERVICE_ACCOUNT is not set, so this build was not deployed."
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.HAS_SERVICE_ACCOUNT == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          channelId: live
